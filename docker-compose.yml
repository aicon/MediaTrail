services:
  mediatrail:
    image: ghcr.io/aicon/mediatrail:latest
    container_name: mediatrail
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      TZ: Europe/Budapest
      SECRET: replace-with-a-long-random-string
      # Uncomment and set if you use private Trakt import (activate code):
      # TRAKT_API_PKCE:
    volumes:
      - ./db:/mediatrail/db
