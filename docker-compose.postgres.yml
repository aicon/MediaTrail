services:
  mediatrail:
    image: ghcr.io/aicon/mediatrail:latest
    container_name: mediatrail
    restart: unless-stopped
    depends_on:
      - db
    environment:
      TZ: Europe/Budapest
      SECRET: replace-with-a-long-random-string
      DB_HOST: db
      DB_NAME: mediatrail
      DB_USER: mediatrail
      DB_PASSWORD: mediatrail
      DB_PORT: 5432
    volumes:
      - ./db:/mediatrail/db
    ports:
      - "8000:8000"

  db:
    image: postgres:16-alpine
    container_name: mediatrail-db
    environment:
      POSTGRES_DB: mediatrail
      POSTGRES_USER: mediatrail
      POSTGRES_PASSWORD: mediatrail
    volumes:
      - ./postgres:/var/lib/postgresql/data
    restart: unless-stopped
