{% load i18n %}
{# Theme control. Wide: three icons. Narrow portrait: current icon opens a panel. #}
<div class="mt-theme-switch"
     role="group"
     aria-label="{% translate 'Theme' %}"
     @keydown.escape.window="menuOpen = false"
     x-data="themeSwitcher({
       theme: '{{ request.user.theme|escapejs }}',
       url: '{% url 'update_theme' %}',
       csrfToken: '{{ csrf_token|escapejs }}',
       saveFailed: '{% translate "Could not save the theme."|escapejs %}'
     })">
  <span class="sr-only" aria-live="polite" x-text="statusMessage"></span>

  <div class="mt-theme-wide">
    <button type="button"
            class="mt-theme-btn"
            :class="{ 'is-active': theme === 'system' }"
            :aria-pressed="theme === 'system' ? 'true' : 'false'"
            aria-label="{% translate 'System theme' %}"
            title="{% translate 'System theme' %}"
            :disabled="busy"
            @click="setTheme('system')">
      {% include "app/icons/theme-system.svg" with classes="mt-theme-icon" %}
    </button>
    <button type="button"
            class="mt-theme-btn"
            :class="{ 'is-active': theme === 'light' }"
            :aria-pressed="theme === 'light' ? 'true' : 'false'"
            aria-label="{% translate 'Light theme' %}"
            title="{% translate 'Light theme' %}"
            :disabled="busy"
            @click="setTheme('light')">
      {% include "app/icons/theme-sun.svg" with classes="mt-theme-icon" %}
    </button>
    <button type="button"
            class="mt-theme-btn"
            :class="{ 'is-active': theme === 'dark' }"
            :aria-pressed="theme === 'dark' ? 'true' : 'false'"
            aria-label="{% translate 'Dark theme' %}"
            title="{% translate 'Dark theme' %}"
            :disabled="busy"
            @click="setTheme('dark')">
      {% include "app/icons/theme-moon.svg" with classes="mt-theme-icon" %}
    </button>
  </div>

  <div class="mt-theme-narrow" @click.outside="menuOpen = false">
    <button type="button"
            class="mt-theme-btn is-active"
            :aria-expanded="menuOpen ? 'true' : 'false'"
            aria-haspopup="true"
            aria-controls="mt-theme-menu"
            aria-label="{% translate 'Theme' %}"
            title="{% translate 'Theme' %}"
            :disabled="busy"
            @click="menuOpen = !menuOpen">
      <span x-show="theme === 'system'" x-cloak>{% include "app/icons/theme-system.svg" with classes="mt-theme-icon" %}</span>
      <span x-show="theme === 'light'" x-cloak>{% include "app/icons/theme-sun.svg" with classes="mt-theme-icon" %}</span>
      <span x-show="theme === 'dark'" x-cloak>{% include "app/icons/theme-moon.svg" with classes="mt-theme-icon" %}</span>
    </button>
    <div id="mt-theme-menu"
         class="mt-theme-menu"
         role="menu"
         x-cloak
         x-show="menuOpen"
         x-transition.opacity.duration.150ms>
      <button type="button"
              role="menuitemradio"
              class="mt-theme-btn"
              :class="{ 'is-active': theme === 'system' }"
              :aria-checked="theme === 'system' ? 'true' : 'false'"
              aria-label="{% translate 'System theme' %}"
              title="{% translate 'System theme' %}"
              :disabled="busy"
              @click="setTheme('system')">
        {% include "app/icons/theme-system.svg" with classes="mt-theme-icon" %}
      </button>
      <button type="button"
              role="menuitemradio"
              class="mt-theme-btn"
              :class="{ 'is-active': theme === 'light' }"
              :aria-checked="theme === 'light' ? 'true' : 'false'"
              aria-label="{% translate 'Light theme' %}"
              title="{% translate 'Light theme' %}"
              :disabled="busy"
              @click="setTheme('light')">
        {% include "app/icons/theme-sun.svg" with classes="mt-theme-icon" %}
      </button>
      <button type="button"
              role="menuitemradio"
              class="mt-theme-btn"
              :class="{ 'is-active': theme === 'dark' }"
              :aria-checked="theme === 'dark' ? 'true' : 'false'"
              aria-label="{% translate 'Dark theme' %}"
              title="{% translate 'Dark theme' %}"
              :disabled="busy"
              @click="setTheme('dark')">
        {% include "app/icons/theme-moon.svg" with classes="mt-theme-icon" %}
      </button>
    </div>
  </div>
</div>
