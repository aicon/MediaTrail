{% load app_tags %}
{% comment %}Activity badge on the poster bottom-right corner. Expects `accent`.{% endcomment %}
{% with badge=accent|journal_accent %}
  <span class="journal-badge absolute bottom-1 right-1 w-5 h-5 rounded-full flex items-center justify-center ring-2 ring-[#2a2f35] shadow-md {{ badge.background }}">
    {% include badge.icon with classes="w-3 h-3 text-white" %}
  </span>
{% endwith %}
