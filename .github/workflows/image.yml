name: image

on:
  push:
    branches: [dev]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject unsupported requirements.txt
        run: |
          if [ -f requirements.txt ]; then
            echo "requirements.txt is not a supported install path; use uv.lock / uv sync --locked" >&2
            exit 1
          fi

      - name: Verify lock includes DRF and Pillow 13
        run: |
          grep -q 'name = "djangorestframework"' uv.lock
          grep -q 'name = "drf-spectacular"' uv.lock
          grep -E 'name = "pillow"' -A1 uv.lock | grep -q 'version = "13\.'
          grep -q 'uv sync --locked' Dockerfile
          if grep -q 'uv pip install' Dockerfile; then
            echo "Dockerfile must not uv pip install packages outside the lock" >&2
            exit 1
          fi

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image version
        id: version
        run: |
          image=ghcr.io/aicon/mediatrail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
            tags="${image}:${version}"$'\n'"${image}:latest"
          elif [[ "${GITHUB_REF}" == refs/heads/dev ]]; then
            version="dev"
            tags="${image}:dev"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        if: steps.version.outputs.skip != 'true'
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.version.outputs.tags }}
